syntax = "proto3";

package kv;

option go_package = "proto/gen/kv";

service Omni {
  rpc Get(GetRequest) returns (GetResponse) {}
  rpc Put(PutRequest) returns (PutResponse) {}
  rpc Delete(DeleteRequest) returns (DeleteResponse) {}
  rpc List(ListRequest) returns (stream ListResponse) {}
  rpc Scan(ScanRequest) returns (ScanResponse) {}
}

message KeyValue {
  optional bytes key = 1;
  optional bytes value = 2;
}

message GetRequest { optional bytes key = 1; }
message GetResponse { optional bytes value = 1; }

message PutRequest { KeyValue pair = 1; }
message PutResponse {}

message DeleteRequest { optional bytes key = 1; }
message DeleteResponse {}

message ListRequest {
  optional bytes prefix = 1;
  optional uint32 limit = 2;
}
message ListResponse { KeyValue pair = 1; }

message ScanRequest {}
message ScanResponse { repeated KeyValue pairs = 1; }