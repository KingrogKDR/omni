syntax = "proto3";

package kv;

option go_package = "proto/gen/kv";

service Omni {
  rpc Get(GetRequest) returns (GetResponse) {}
  rpc Put(PutRequest) returns (PutResponse) {}
  rpc Delete(DeleteRequest) returns (DeleteResponse) {}
  rpc List(ListRequest) returns (ListResponse) {}
}

message GetRequest { optional bytes key = 1; }
message GetResponse { optional bytes value = 1; }

message PutRequest {
  optional bytes key = 1;
  optional bytes value = 2;
}
message PutResponse {}

message DeleteRequest { optional bytes key = 1; }
message DeleteResponse {}

message ListRequest {}
message ListResponse { map<string, string> key_value = 1; }