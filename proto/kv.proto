syntax = "proto3";

package kv;

option go_package = "proto/gen/kv";

service Omni {
  rpc Get(GetRequest) returns (GetResponse) {}
  rpc Put(PutRequest) returns (PutResponse) {}
  rpc Delete(DeleteRequest) returns (DeleteResponse) {}
  rpc Scan(ScanRequest) returns (ScanResponse) {}
}

message KeyValue {
  optional bytes key = 1;
  optional bytes value = 2;
}

message GetRequest {
  optional bytes cf = 1;
  optional bytes key = 2;
}
message GetResponse {
  optional bytes val = 1;
  bool not_found = 2;
}

message PutRequest {
  optional bytes cf = 1;
  optional bytes key = 2;
  optional bytes val = 3;
}
message PutResponse { bool success = 1; }

message DeleteRequest {
  optional bytes cf = 1;
  optional bytes key = 2;
}
message DeleteResponse { bool success = 1; }

message ScanOptions {
  optional bytes prefix = 1;
  optional bytes start = 2;
  optional bytes end = 3;
  optional uint32 limit = 4;
  optional bool reverse = 5;
}

message ScanRequest {
  optional bytes cf = 1;
  ScanOptions scan_options = 2;
}

message ScanResponse { repeated KeyValue pairs = 1; }